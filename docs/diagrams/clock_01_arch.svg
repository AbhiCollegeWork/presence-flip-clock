<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="786" viewBox="0 0 1240 786" role="img" aria-label="Presence Flip Clock architecture"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#afb8c1"/></marker><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#0969da"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#1a7f37"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#cf222e"/></marker><marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#8250df"/></marker></defs><rect width="1240" height="786" fill="#ffffff"/><g font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="40" y="22" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#0969da" font-weight="700" text-anchor="start" letter-spacing="1.4">PRESENCE FLIP CLOCK / ARCHITECTURE</text><text x="40" y="44" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#1f2328" font-weight="700" text-anchor="start">How the app is put together</text><text x="40" y="66" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#5a6470" font-weight="400" text-anchor="start">One activity, one analysis stream, no preview surface, no network code. Everything happens inside the phone.</text><text x="40" y="104" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a6470" font-weight="700" text-anchor="start" letter-spacing="1.2">THE LOOP</text><rect x="40" y="120" width="1160" height="202" rx="11" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><rect x="68" y="148" width="250" height="148" rx="9" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/><rect x="68" y="148" width="250" height="4.5" rx="2.2" fill="#0969da"/><text x="86" y="180" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">Front camera</text><text x="86" y="208" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">CameraX ImageAnalysis.</text><text x="86" y="224" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">No preview surface is ever</text><text x="86" y="240" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">created, so no image is</text><text x="86" y="256" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">rendered or saved.</text><path d="M320,222 L342,222" fill="none" stroke="#afb8c1" stroke-width="2.2" marker-end="url(#ar)"/><rect x="350" y="148" width="250" height="148" rx="9" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/><rect x="350" y="148" width="250" height="4.5" rx="2.2" fill="#8250df"/><text x="368" y="180" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">MotionAnalyzer</text><text x="368" y="208" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">Reads the luma plane into</text><text x="368" y="224" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">a 32 x 24 grid, cancels the</text><text x="368" y="240" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">global shift, counts locally</text><text x="368" y="256" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">changed cells.</text><path d="M602,222 L624,222" fill="none" stroke="#afb8c1" stroke-width="2.2" marker-end="url(#ar)"/><rect x="632" y="148" width="250" height="148" rx="9" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/><rect x="632" y="148" width="250" height="4.5" rx="2.2" fill="#1b7c83"/><text x="650" y="180" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">MainActivity</text><text x="650" y="208" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">Holds the brightness state</text><text x="650" y="224" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">machine and the idle timer.</text><text x="650" y="240" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">Decides bright, dim, or</text><text x="650" y="256" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">true power off.</text><path d="M884,222 L906,222" fill="none" stroke="#afb8c1" stroke-width="2.2" marker-end="url(#ar)"/><rect x="914" y="148" width="250" height="148" rx="9" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/><rect x="914" y="148" width="250" height="4.5" rx="2.2" fill="#1a7f37"/><text x="932" y="180" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">The window</text><text x="932" y="208" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">WindowManager.LayoutParams</text><text x="932" y="224" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">.screenBrightness, which is</text><text x="932" y="240" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">app local and needs NO</text><text x="932" y="256" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">permission at all.</text><text x="300" y="215" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#5a6470" font-weight="400" text-anchor="middle">frames</text><text x="582" y="215" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="10" fill="#5a6470" font-weight="400" text-anchor="middle">onMotion()</text><text x="864" y="215" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="10" fill="#5a6470" font-weight="400" text-anchor="middle">0.0 to 1.0</text><path d="M1039,298 C1039,330 193,330 193,300" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arP)"/><text x="620" y="350" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8250df" font-weight="600" text-anchor="middle">the screen stays on and in the foreground, which is what keeps the camera legal to run</text><text x="40" y="404" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a6470" font-weight="700" text-anchor="start" letter-spacing="1.2">SOURCE FILES</text><rect x="40" y="420" width="720" height="44" rx="7" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/><rect x="40" y="420" width="4.5" height="44" rx="2.2" fill="#1b7c83"/><text x="58" y="447" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start">MainActivity.kt</text><text x="280" y="447" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">State machine, idle timer, settings dialog, Device Admin lifecycle.</text><rect x="40" y="470" width="720" height="44" rx="7" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/><rect x="40" y="470" width="4.5" height="44" rx="2.2" fill="#8250df"/><text x="58" y="497" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start">MotionAnalyzer.kt</text><text x="280" y="497" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">The detector. The only file where the presence logic lives.</text><rect x="40" y="520" width="720" height="44" rx="7" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/><rect x="40" y="520" width="4.5" height="44" rx="2.2" fill="#0969da"/><text x="58" y="547" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start">FlipClockView.kt</text><text x="280" y="547" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">Lays out the digit cards and drives the flip on a minute change.</text><rect x="40" y="570" width="720" height="44" rx="7" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/><rect x="40" y="570" width="4.5" height="44" rx="2.2" fill="#0969da"/><text x="58" y="597" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start">FlipDigitView.kt</text><text x="280" y="597" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">One card, one 3D flip animation, drawn with plain Canvas.</text><rect x="40" y="620" width="720" height="44" rx="7" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/><rect x="40" y="620" width="4.5" height="44" rx="2.2" fill="#39414a"/><text x="58" y="647" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start">Prefs.kt</text><text x="280" y="647" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">Six settings in SharedPreferences. No database, no cloud.</text><rect x="40" y="670" width="720" height="44" rx="7" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/><rect x="40" y="670" width="4.5" height="44" rx="2.2" fill="#9a6700"/><text x="58" y="697" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start">ClockDeviceAdminReceiver.kt</text><text x="280" y="697" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">Exists only so deep power off mode can lock the screen.</text><rect x="788" y="420" width="412" height="300" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.3"/><text x="810" y="448" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9a6700" font-weight="700" text-anchor="start" letter-spacing="1.1">THE CONSTRAINT THAT SHAPES EVERYTHING</text><text x="810" y="474.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#39414a" font-weight="400" text-anchor="start">A non rooted Android app cannot turn the</text><text x="810" y="490.5" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#39414a" font-weight="400" text-anchor="start">screen off and keep using the camera.</text><text x="810" y="507.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#39414a" font-weight="400" text-anchor="start">Android stops background camera access.</text><text x="810" y="542" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#39414a" font-weight="400" text-anchor="start">So the app does the one thing that works:</text><text x="810" y="566" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" fill="#9a6700" font-weight="700" text-anchor="start">stay in the foreground, hold the screen on,</text><text x="810" y="583" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" fill="#9a6700" font-weight="700" text-anchor="start">and modulate the BACKLIGHT instead.</text><rect x="810" y="602" width="368" height="100" rx="7" fill="#fff" stroke="#d4a72c" stroke-width="1.2"/><text x="826" y="626" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2328" font-weight="700" text-anchor="start">Two consequences worth knowing</text><text x="826" y="648.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.8" fill="#5a6470" font-weight="400" text-anchor="start">1. Screenshots always look bright. Dimming</text><text x="826" y="662.5" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.8" fill="#5a6470" font-weight="400" text-anchor="start">    changes the backlight, not the pixels.</text><text x="826" y="677.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.8" fill="#5a6470" font-weight="400" text-anchor="start">2. On OLED, brightness 0 looks genuinely off.</text><text x="826" y="691.5" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.8" fill="#5a6470" font-weight="400" text-anchor="start">    On LCD you may still see a faint glow.</text><rect x="40" y="736" width="1160" height="58.0" rx="7" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.2"/><text x="52" y="760" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1a7f37" font-weight="700" text-anchor="start">What this app talks to</text><text x="52" y="779.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#39414a" font-weight="400" text-anchor="start">No network permission is declared. There is no analytics, no account, no cloud, and no update check. The APK is a clock.</text></g></svg>