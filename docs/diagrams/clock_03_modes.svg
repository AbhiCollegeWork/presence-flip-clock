<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="906" viewBox="0 0 1240 906" role="img" aria-label="The two idle modes and the brightness state machine"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#afb8c1"/></marker><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#0969da"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#1a7f37"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#cf222e"/></marker><marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#8250df"/></marker></defs><rect width="1240" height="906" fill="#ffffff"/><g font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="40" y="22" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#0969da" font-weight="700" text-anchor="start" letter-spacing="1.4">PRESENCE FLIP CLOCK / BEHAVIOUR</text><text x="40" y="44" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#1f2328" font-weight="700" text-anchor="start">The two idle modes, and why you must choose</text><text x="40" y="66" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#5a6470" font-weight="400" text-anchor="start">One wakes on presence but never truly powers off. The other truly powers off but cannot see you. That trade is a platform limit, not a bug.</text><text x="40" y="104" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#0969da" font-weight="700" text-anchor="start" letter-spacing="1.2">DIM MODE, THE DEFAULT</text><rect x="40" y="120" width="566" height="322" rx="11" fill="#fff" stroke="#54aeff" stroke-width="1.5"/><rect x="88" y="156" width="200" height="66" rx="9" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/><text x="188" y="182" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1a7f37" font-weight="700" text-anchor="middle">PRESENT</text><text x="188" y="202" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="11.3" fill="#1a7f37" font-weight="400" text-anchor="middle">brightness 1.0</text><rect x="88" y="330" width="200" height="66" rx="9" fill="#e7ecf0" stroke="#afb8c1" stroke-width="1.4"/><text x="188" y="356" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#39414a" font-weight="700" text-anchor="middle">IDLE</text><text x="188" y="376" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="11.3" fill="#39414a" font-weight="400" text-anchor="middle">brightness 0.0</text><path d="M148,226 L148,326" fill="none" stroke="#afb8c1" stroke-width="2.2" marker-end="url(#ar)"/><text x="138" y="280" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5a6470" font-weight="400" text-anchor="end">no motion for</text><text x="138" y="295" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="11" fill="#5a6470" font-weight="400" text-anchor="end">idleTimeout</text><path d="M228,326 L228,226" fill="none" stroke="#1a7f37" stroke-width="2.2" marker-end="url(#arG)"/><text x="240" y="272" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1a7f37" font-weight="600" text-anchor="start">motion detected</text><text x="240" y="287" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1a7f37" font-weight="600" text-anchor="start">or screen tapped</text><rect x="330" y="156" width="240" height="240" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="348" y="182" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328" font-weight="700" text-anchor="start">While idle</text><text x="348" y="206" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#5a6470" font-weight="400" text-anchor="start">The screen is technically on,</text><text x="348" y="222" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#5a6470" font-weight="400" text-anchor="start">just at zero backlight.</text><text x="348" y="238" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#5a6470" font-weight="400" text-anchor="start"></text><text x="348" y="254" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#5a6470" font-weight="400" text-anchor="start">The camera keeps analysing,</text><text x="348" y="270" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#5a6470" font-weight="400" text-anchor="start">which is exactly why it can</text><text x="348" y="286" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#5a6470" font-weight="400" text-anchor="start">wake on presence.</text><text x="348" y="302" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#5a6470" font-weight="400" text-anchor="start"></text><text x="348" y="318" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#5a6470" font-weight="400" text-anchor="start">On OLED this looks fully off.</text><text x="348" y="334" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#5a6470" font-weight="400" text-anchor="start">On LCD a faint glow may</text><text x="348" y="350" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#5a6470" font-weight="400" text-anchor="start">remain, which is why the</text><text x="348" y="366" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#5a6470" font-weight="400" text-anchor="start">other mode exists.</text><text x="634" y="104" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9a6700" font-weight="700" text-anchor="start" letter-spacing="1.2">DEEP POWER OFF, OPT IN</text><rect x="634" y="120" width="566" height="322" rx="11" fill="#fff" stroke="#d4a72c" stroke-width="1.5"/><rect x="682" y="156" width="200" height="66" rx="9" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/><text x="782" y="182" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1a7f37" font-weight="700" text-anchor="middle">AWAKE</text><text x="782" y="202" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#1a7f37" font-weight="400" text-anchor="middle">clock visible</text><rect x="682" y="330" width="200" height="66" rx="9" fill="#22262b" stroke="#22262b" stroke-width="1.4"/><text x="782" y="356" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">SCREEN OFF</text><text x="782" y="376" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#c9d1d9" font-weight="400" text-anchor="middle">truly powered down</text><path d="M742,226 L742,326" fill="none" stroke="#afb8c1" stroke-width="2.2" marker-end="url(#ar)"/><text x="732" y="272" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5a6470" font-weight="400" text-anchor="end">idle timeout,</text><text x="732" y="287" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="11" fill="#5a6470" font-weight="400" text-anchor="end">then lockNow()</text><path d="M822,326 L822,226" fill="none" stroke="#9a6700" stroke-width="2.2" marker-end="url(#ar)"/><text x="834" y="272" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9a6700" font-weight="700" text-anchor="start">POWER</text><text x="834" y="287" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9a6700" font-weight="700" text-anchor="start">BUTTON only</text><rect x="924" y="156" width="240" height="240" rx="9" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/><text x="942" y="182" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a6700" font-weight="700" text-anchor="start">The hard limit</text><text x="942" y="206" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#39414a" font-weight="400" text-anchor="start">A screen that is genuinely off</text><text x="942" y="222" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#39414a" font-weight="400" text-anchor="start">cannot run the camera on non</text><text x="942" y="238" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#39414a" font-weight="400" text-anchor="start">rooted Android. So presence</text><text x="942" y="254" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#39414a" font-weight="400" text-anchor="start">cannot be detected while it is</text><text x="942" y="270" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#39414a" font-weight="400" text-anchor="start">off.</text><text x="942" y="318" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#9a6700" font-weight="600" text-anchor="start">This is documented, not</text><text x="942" y="334" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#9a6700" font-weight="600" text-anchor="start">worked around. It is a</text><text x="942" y="350" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#9a6700" font-weight="600" text-anchor="start">platform rule, and no app</text><text x="942" y="366" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#9a6700" font-weight="600" text-anchor="start">can honestly escape it.</text><text x="40" y="486" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a6470" font-weight="700" text-anchor="start" letter-spacing="1.2">WHICH ONE DO I WANT</text><rect x="40" y="502" width="1160" height="62" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/><rect x="40" y="502" width="4.5" height="62" rx="2.2" fill="#0969da"/><text x="60" y="528" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.3" fill="#1f2328" font-weight="700" text-anchor="start">Your screen is OLED / AMOLED</text><rect x="438" y="517" width="72.56" height="21" rx="10.5" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.2"/><text x="474.28" y="531.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#0969da" font-weight="600" text-anchor="middle">Dim mode</text><text x="600" y="528" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">Brightness 0 is visually indistinguishable from off, and you keep presence wake.</text><text x="60" y="548" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328" font-weight="400" text-anchor="start"></text><rect x="40" y="572" width="1160" height="62" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/><rect x="40" y="572" width="4.5" height="62" rx="2.2" fill="#9a6700"/><text x="60" y="598" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.3" fill="#1f2328" font-weight="700" text-anchor="start">Your screen is LCD</text><rect x="438" y="587" width="113.48" height="21" rx="10.5" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/><text x="494.74" y="601.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9a6700" font-weight="600" text-anchor="middle">Deep power off</text><text x="600" y="598" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">LCD backlights leak. If a faint glow bothers you at night, take the power button trade.</text><text x="60" y="618" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328" font-weight="400" text-anchor="start"></text><rect x="40" y="642" width="1160" height="62" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/><rect x="40" y="642" width="4.5" height="62" rx="2.2" fill="#0969da"/><text x="60" y="668" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.3" fill="#1f2328" font-weight="700" text-anchor="start">You want it to wake as you walk up</text><rect x="438" y="657" width="72.56" height="21" rx="10.5" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.2"/><text x="474.28" y="671.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#0969da" font-weight="600" text-anchor="middle">Dim mode</text><text x="600" y="668" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">This is the only mode where the camera can see you. Non negotiable.</text><text x="60" y="688" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328" font-weight="400" text-anchor="start"></text><rect x="40" y="712" width="1160" height="62" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/><rect x="40" y="712" width="4.5" height="62" rx="2.2" fill="#9a6700"/><text x="60" y="738" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.3" fill="#1f2328" font-weight="700" text-anchor="start">It is a bedside clock and glow matters</text><rect x="438" y="727" width="113.48" height="21" rx="10.5" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/><text x="494.74" y="741.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9a6700" font-weight="600" text-anchor="middle">Deep power off</text><text x="600" y="738" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.3" fill="#5a6470" font-weight="400" text-anchor="start">Zero light. Press power to check the time.</text><text x="60" y="758" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328" font-weight="400" text-anchor="start"></text><rect x="40" y="796" width="566" height="78" rx="9" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.3"/><text x="62" y="822" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1a7f37" font-weight="700" text-anchor="start">Anti burn in, in both modes</text><text x="62" y="844.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#39414a" font-weight="400" text-anchor="start">The clock nudges its position a few pixels every minute so a</text><text x="62" y="859.5" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#39414a" font-weight="400" text-anchor="start">static digit never sits on the same OLED sub pixels for months.</text><rect x="634" y="796" width="566" height="78" rx="9" fill="#ffebe9" stroke="#ff8182" stroke-width="1.3"/><text x="656" y="822" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#cf222e" font-weight="700" text-anchor="start">Deep power off needs Device Admin</text><text x="656" y="844.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#39414a" font-weight="400" text-anchor="start">Granting it is what allows lockNow(). The app removes its OWN admin</text><text x="656" y="859.5" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" fill="#39414a" font-weight="400" text-anchor="start">the moment you switch the mode off, so uninstall is never blocked.</text></g></svg>